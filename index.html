<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space News Live</title>
    <!-- Use Google Fonts for clear readability -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@600;800&display=swap"
        rel="stylesheet">
    <style>
        /* CSS Viewport Units (vw, vh) ensure layout scales proportionally on browser zoom */
        :root {
            --bg-dark: #020617;
            --panel-bg: rgba(15, 23, 42, 0.7);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* No scrollbars */
            background: linear-gradient(135deg, #020617, #0f172a, #020617);
            background-size: 200% 200%;
            animation: gradientBG 20s ease infinite;
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            box-sizing: border-box;
        }
        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        /* Animated Starfield */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image:
                radial-gradient(1.5px 1.5px at 10vw 20vh, #ffffff, transparent),
                radial-gradient(1px 1px at 30vw 50vh, #ffffff, transparent),
                radial-gradient(2px 2px at 50vw 80vh, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 70vw 30vh, #ffffff, transparent),
                radial-gradient(1px 1px at 90vw 60vh, #ffffff, transparent),
                radial-gradient(2px 2px at 20vw 80vh, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 80vw 10vh, #ffffff, transparent);
            background-size: 100vw 100vh;
            animation: twinkling 4s infinite ease-in-out;
        }
        @keyframes twinkling {
            0% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(1.02);
            }
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
        }
        header {
            height: 10vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3vw;
            background: linear-gradient(to bottom, rgba(2, 6, 23, 0.9), transparent);
            border-bottom: 0.2vh solid rgba(59, 130, 246, 0.3);
        }
        .logo {
            font-family: 'Oswald', sans-serif;
            font-size: 3vw;
            font-weight: 800;
            color: var(--accent);
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.2vw;
            text-shadow: 0 0 1vw rgba(59, 130, 246, 0.5);
        }
        .clock-area {
            text-align: right;
        }
        #clock {
            font-size: 2.5vw;
            font-weight: 700;
            line-height: 1;
        }
        #date {
            font-size: 1.2vw;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1vw;
        }
        main {
            display: flex;
            height: 90vh;
            padding: 2vh 2vw;
            gap: 2vw;
            box-sizing: border-box;
        }
        /* Left Sidebar Widgets */
        aside {
            width: 22vw;
            display: flex;
            flex-direction: column;
            gap: 1vh;
            overflow: hidden;
        }
        .widget {
            background: var(--panel-bg);
            border: 0.1vh solid rgba(255, 255, 255, 0.05);
            border-radius: 1vw;
            padding: 1.2vh 1.5vw;
            backdrop-filter: blur(1vw);
            box-shadow: 0 1vh 2vw rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .widget h3 {
            margin: 0 0 0.8vh 0;
            font-family: 'Oswald', sans-serif;
            font-size: 1.3vw;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1vw;
            border-bottom: 0.2vh solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.4vh;
            flex-shrink: 0;
        }
        /* APOD widget — takes ~38% of available sidebar height */
        #apod-container {
            flex: 0 0 auto;
        }
        #apod-img {
            width: 100%;
            height: 22vh;
            object-fit: cover;
            border-radius: 0.5vw;
            margin-bottom: 0.7vh;
            border: 0.15vh solid rgba(59,130,246,0.4);
            box-shadow: 0 0 1.5vw rgba(59,130,246,0.25);
            display: block;   /* always visible — no click needed */
            cursor: default;
        }
        #apod-title {
            font-size: 1.05vw;
            font-weight: 600;
            line-height: 1.4;
            color: #e2e8f0;
        }
        /* ISS orbit widget — fixed compact height */
        #iss-widget {
            flex: 0 0 auto;
            overflow: hidden;
        }
        #av-orbit {
            width: 100%;
            overflow: hidden;
        }
        #av-orbit iframe {
            width: 100% !important;
            height: 20vh !important;
            min-height: unset !important;
            max-height: 20vh !important;
            border: none !important;
            display: block;
            border-radius: 0.5vw;
        }
        /* Upcoming Launches — fills remaining space */
        #launch-widget {
            flex: 1 1 0;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .launch-item {
            margin-bottom: 1.2vh;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .launch-item:hover {
            transform: translateX(0.5vw);
        }
        .launch-item:active {
            transform: scale(0.98);
        }
        .launch-name {
            font-size: 1.05vw;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e2e8f0;
        }
        .launch-time {
            font-size: 0.95vw;
            color: #f87171;
            font-weight: 600;
        }
        #launch-list {
            flex: 1;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }
        .launch-track {
            display: flex;
            flex-direction: column;
            animation: scrollUp 25s linear infinite;
        }
        @keyframes scrollUp {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-50%);
            }
        }
        /* ── Interactive ON / OFF Buttons (header top-right) ── */
        .interactive-controls {
            display: flex;
            align-items: center;
            gap: 0.5vw;
            margin-left: 2vw;
        }
        .interactive-controls .ctrl-label {
            font-family: 'Oswald', sans-serif;
            font-size: 1vw;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08vw;
            margin-right: 0.3vw;
        }
        .ctrl-btn {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1vw;
            letter-spacing: 0.1vw;
            text-transform: uppercase;
            padding: 0.6vh 1.5vw;
            border-radius: 0.4vw;
            border: 0.15vh solid transparent;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s, box-shadow 0.25s, color 0.25s;
            user-select: none;
        }
        #btn-on {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.35);
            color: #86efac;
        }
        #btn-on:hover,
        #btn-on.active {
            background: rgba(34, 197, 94, 0.25);
            border-color: #22c55e;
            color: #fff;
            box-shadow: 0 0 1vw rgba(34, 197, 94, 0.5);
        }
        #btn-off {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }
        #btn-off:hover,
        #btn-off.active {
            background: rgba(239, 68, 68, 0.25);
            border-color: #ef4444;
            color: #fff;
            box-shadow: 0 0 1vw rgba(239, 68, 68, 0.5);
        }
        /* Main News Area */
        .news-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--panel-bg);
            border: 0.1vh solid rgba(255, 255, 255, 0.05);
            border-radius: 1vw;
            padding: 2vh 2vw;
            backdrop-filter: blur(1vw);
            box-shadow: 0 1vh 2vw rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2vh;
            height: 6vh;
        }
        #category-title {
            font-family: 'Oswald', sans-serif;
            font-size: 3vw;
            font-weight: 800;
            margin: 0;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.1vw;
            transition: color 0.5s;
        }
        .progress-container {
            width: 15vw;
            height: 0.6vh;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0.3vw;
            overflow: hidden;
            margin-bottom: 1vh;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.1s linear, background-color 0.5s;
        }
        .carousel-viewport {
            flex: 1;
            overflow: hidden;
            position: relative;
            /* No fade — full card always readable */
        }
        #news-track {
            display: flex;
            flex-direction: column;
            gap: 2vh;
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .news-card {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0.8vw;
            border-top: 0.4vh solid var(--accent);
            height: 38vh;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 0.5vh 1vw rgba(0, 0, 0, 0.2);
            border-left: 0.1vh solid rgba(255, 255, 255, 0.05);
            border-right: 0.1vh solid rgba(255, 255, 255, 0.05);
            border-bottom: 0.1vh solid rgba(255, 255, 255, 0.05);
        }
        .news-img {
            width: 18vw;
            height: 100%;
            object-fit: cover;
            border-right: 0.1vh solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        .news-content {
            padding: 2vh 2vw;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
        }
        .news-headline {
            font-size: 1.8vw;
            font-weight: 700;
            line-height: 1.35;
            margin: 0 0 1.2vh 0;
            color: #f8fafc;
        }
        .news-desc {
            font-size: 1.25vw;
            color: var(--text-muted);
            margin: 0 0 1.2vh 0;
            line-height: 1.6;
            flex: 1;
            overflow: hidden;
        }
        .news-meta {
            font-size: 1.1vw;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            flex-shrink: 0;
        }
        .news-source {
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.05vw;
        }
        /* ── Interactive Navigation Controls ── */
        #interactive-controls {
            display: none;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5vh;
            gap: 1vw;
        }
        #interactive-controls.visible {
            display: flex;
        }
        .nav-group {
            display: flex;
            align-items: center;
            gap: 0.6vw;
        }
        .nav-label {
            font-family: 'Oswald', sans-serif;
            font-size: 1vw;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08vw;
        }
        .nav-btn {
            background: rgba(59,130,246,0.12);
            border: 0.15vh solid rgba(59,130,246,0.45);
            color: #93c5fd;
            border-radius: 0.5vw;
            padding: 0.55vh 1.1vw;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1vw;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            user-select: none;
            letter-spacing: 0.05vw;
        }
        .nav-btn:hover {
            background: rgba(59,130,246,0.28);
            color: #fff;
            box-shadow: 0 0 0.8vw rgba(59,130,246,0.35);
        }
        .nav-btn:active {
            background: rgba(59,130,246,0.45);
        }
        .nav-divider {
            width: 0.12vw;
            height: 2.5vh;
            background: rgba(255,255,255,0.12);
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-dark);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Oswald', sans-serif;
            font-size: 4vw;
            color: var(--accent);
            transition: opacity 1s;
        }
        .spinner {
            width: 4vw;
            height: 4vw;
            border: 0.4vw solid rgba(255, 255, 255, 0.1);
            border-top: 0.4vw solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 2vh;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        /* Modal for Touch Interaction */
        #news-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(0.5vw);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-content {
            background: var(--bg-dark);
            border: 0.2vh solid var(--accent);
            border-radius: 1vw;
            width: 70vw;
            max-height: 85vh;
            padding: 4vh 4vw;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 2vh 4vw rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }
        .close-btn {
            position: absolute;
            top: 2vh;
            right: 2vw;
            font-size: 4vw;
            color: #94a3b8;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #f8fafc;
        }
        #modal-img {
            width: 100%;
            height: 35vh;
            object-fit: cover;
            border-radius: 0.8vw;
            margin-bottom: 3vh;
            border: 0.1vh solid rgba(255, 255, 255, 0.1);
        }
        #modal-title {
            font-size: 2.5vw;
            font-family: 'Oswald', sans-serif;
            margin: 0 0 2vh 0;
            color: #f8fafc;
        }
        #modal-desc {
            font-size: 1.6vw;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 3vh 0;
        }
        .modal-meta {
            display: flex;
            justify-content: space-between;
            font-size: 1.3vw;
            color: #64748b;
            margin-bottom: 3vh;
        }
        #modal-source {
            font-weight: bold;
            color: var(--accent);
            text-transform: uppercase;
        }
        #modal-link {
            display: inline-block;
            align-self: flex-start;
            padding: 1.5vh 3vw;
            background: var(--accent);
            color: white;
            text-decoration: none;
            font-size: 1.5vw;
            font-weight: bold;
            border-radius: 0.5vw;
            text-transform: uppercase;
            letter-spacing: 0.1vw;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div>INITIALIZING SPACE SYSTEMS</div>
        <div class="spinner"></div>
    </div>
    <div id="starfield"></div>
    <!-- News Expansion Modal -->
    <div id="news-modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <img id="modal-img" src="" alt="News Image">
            <h2 id="modal-title"></h2>
            <p id="modal-desc"></p>
            <div class="modal-meta">
                <span id="modal-source"></span>
                <span id="modal-date"></span>
            </div>
            <a id="modal-link" href="#" target="_blank">Read Full Article</a>
        </div>
    </div>
    <header>
        <div class="logo">Space News Live</div>
        <div style="display:flex; align-items:center; gap:2vw;">
            <!-- Interactive ON / OFF -->
            <div class="interactive-controls">
                <span class="ctrl-label">Interactive</span>
                <button id="btn-on"  class="ctrl-btn" onclick="setInteractive(true)">ON</button>
                <button id="btn-off" class="ctrl-btn active" onclick="setInteractive(false)">OFF</button>
            </div>
            <div class="clock-area">
                <div id="date">Loading Date...</div>
                <div id="clock">--:--:--</div>
            </div>
        </div>
    </header>
    <main>
        <aside>
            <!-- NASA Image of the Day -->
            <div class="widget" id="apod-container">
                <h3>NASA Image of the Day</h3>
                <img id="apod-img" src="" alt="NASA Image of the Day">
                <div id="apod-title">Fetching imagery...</div>
            </div>
            <!-- ISS Current Position -->
            <div class="widget" id="iss-widget">
                <h3>Current Position of ISS</h3>
                <div id="av-orbit">
                    <script>
                        var avOrbitProperties = {
                            size: 'medium',
                            lang: 'en'
                        };
                    </script>
                    <script src="https://astroviewer.net/widgets/widgets/orbit.js"></script>
                </div>
            </div>
            <!-- Upcoming Launches -->
            <div class="widget" id="launch-widget">
                <h3>Upcoming Launches</h3>
                <div id="launch-list">Syncing schedules...</div>
            </div>
        </aside>
        <section class="news-area">
            <div class="category-header">
                <h2 id="category-title">LOADING...</h2>
                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
            <!-- Interactive navigation bar (only visible in Interactive Mode) -->
            <div id="interactive-controls">
                <div class="nav-group">
                    <span class="nav-label">Section</span>
                    <button class="nav-btn" onclick="manualPrevCategory()">&#8592; Prev</button>
                    <button class="nav-btn" onclick="manualNextCategory()">Next &#8594;</button>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-group">
                    <span class="nav-label">Article</span>
                    <button class="nav-btn" onclick="manualPrevSlide()">&#8593; Up</button>
                    <button class="nav-btn" onclick="manualNextSlide()">Down &#8595;</button>
                </div>
            </div>
            <div class="carousel-viewport">
                <div id="news-track"></div>
            </div>
        </section>
    </main>
    <script>
        const categories = [
            { id: 'missions', name: 'Missions', color: '#3b82f6', query: 'mission' },
            { id: 'launches', name: 'Launches', color: '#ef4444', query: 'launch' },
            {
                id: 'astronomy', name: 'Astronomy', color: '#8b5cf6', feeds: [
                    'https://earthsky.org/space/feed/',
                    'https://earthsky.org/sun/feed/',
                    'https://skyandtelescope.org/astronomy-news/feed/',
                    'https://skyandtelescope.org/astronomy-news/spacecraft-and-space-missions/feed/',
                    'https://skyandtelescope.org/astronomy-news/exoplanets/feed/',
                    'https://skyandtelescope.org/astronomy-news/galaxies/feed/',
                    'https://skyandtelescope.org/astronomy-news/cosmology/feed/',
                    'https://skyandtelescope.org/astronomy-news/black-holes/feed/',
                    'https://skyandtelescope.org/astronomy-news/stellar-science/feed/'
                ]
            },
            { id: 'science', name: 'Space Science', color: '#10b981', query: 'science' },
            { id: 'tech', name: 'Tech & Satellites', color: '#f59e0b', query: 'satellite' }
        ];
        let newsData = {};
        let currentCategoryIndex = 0;
        let currentSlideIndex = 0;
        let isHovered = false;
        let isModalOpen = false;
        let progress = 0;
        // ── Robust image extractor for RSS items ──────────────────────────────
        // Sky & Telescope stores images in several non-standard ways:
        //  • protocol-relative URLs  //cdn.mos.cms.futurecdn.net/...
        //  • src inside single-quoted attributes
        //  • only inside <description>, not <content>
        //  • as the first URL inside a srcset attribute
        const SPACE_FALLBACKS = [
            'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1080&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1080&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?q=80&w=1080&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1614732414444-096e5f1122d5?q=80&w=1080&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1608178398319-48f814d0750c?q=80&w=1080&auto=format&fit=crop'
        ];
        let fallbackIndex = 0;
        function nextFallback() {
            return SPACE_FALLBACKS[fallbackIndex++ % SPACE_FALLBACKS.length];
        }
        function extractImage(item) {
            // 1. rss2json thumbnail field (media:thumbnail / image)
            let url = (item.thumbnail && !item.thumbnail.includes('1x1')) ? item.thumbnail : '';
            // 2. enclosure link
            if (!url && item.enclosure && item.enclosure.link &&
                /\.(jpe?g|png|webp|gif)/i.test(item.enclosure.link)) {
                url = item.enclosure.link;
            }
            // 3. scan content then description for <img src=...> (double or single quotes)
            const imgRegex = /<img[^>]+src=["']([^"'> ]+)["']/i;
            const srcsetRegex = /<img[^>]+srcset=["']([^"'> ]+)/i;
            for (const field of [item.content, item.description]) {
                if (url || !field) continue;
                const m = field.match(imgRegex) || field.match(srcsetRegex);
                if (m) url = m[1].split(/[\s,]/)[0]; // srcset: take first URL
            }
            // 4. fix protocol-relative URLs
            if (url && url.startsWith('//')) url = 'https:' + url;
            // 5. discard tiny tracking pixels (< 10 chars after domain or 1x1 gifs)
            if (url && (url.includes('1x1') || url.length < 20)) url = '';
            return url;
        }
        async function fetchNews() {
            const promises = categories.map(async (cat) => {
                try {
                    if (cat.feeds) {
                        let allArticles = [];
                        for (const feedUrl of cat.feeds) {
                            try {
                                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`);
                                const data = await res.json();
                                if (data.status === 'ok' && data.items) {
                                    const parsed = data.items.map(item => {
                                        const imgUrl = extractImage(item);
                                        return {
                                            title: item.title,
                                            summary: item.description ? item.description.replace(/<[^>]*>?/gm, '').substring(0, 400) + '...' : '',
                                            url: item.link,
                                            image_url: imgUrl,
                                            news_site: feedUrl.includes('earthsky') ? 'EarthSky' : 'Sky & Telescope',
                                            published_at: item.pubDate
                                        };
                                    });
                                    allArticles = allArticles.concat(parsed);
                                }
                            } catch (feedErr) {
                                console.error(`Failed to fetch feed ${feedUrl}:`, feedErr);
                            }
                        }
                        // Sort by published_at descending
                        allArticles.sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
                        newsData[cat.id] = allArticles.slice(0, 30); // Keep top 30 to show variety
                    } else {
                        // Standard spaceflightnewsapi for other categories
                        const res = await fetch(`https://api.spaceflightnewsapi.net/v4/articles/?limit=15&search=${cat.query}&ordering=-published_at`);
                        const data = await res.json();
                        newsData[cat.id] = data.results || [];
                    }
                } catch (e) {
                    console.error(`Failed to fetch ${cat.name}:`, e);
                    newsData[cat.id] = [];
                }
            });
            await Promise.all(promises);
        }
        async function fetchWidgets() {
            // NASA Image of the Day
            try {
                const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.nasa.gov/feeds/iotd-feed/');
                if (!res.ok) throw new Error('NASA IOTD failed');
                const data = await res.json();
                if (data.status === 'ok' && data.items.length > 0) {
                    const item = data.items[0];
                    const imgUrl = (item.enclosure && item.enclosure.link) ? item.enclosure.link : item.thumbnail;
                    if (imgUrl) {
                        document.getElementById('apod-img').src = imgUrl;
                        document.getElementById('apod-img').style.display = 'block';
                        document.getElementById('apod-title').innerText = item.title;
                    } else {
                        throw new Error('No valid image URL found in feed');
                    }
                } else {
                    throw new Error('Invalid feed status');
                }
            } catch (e) {
                console.error('IOTD Error:', e);
                // Fallback image
                document.getElementById('apod-img').src = 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1080&auto=format&fit=crop';
                document.getElementById('apod-img').style.display = 'block';
                document.getElementById('apod-title').innerText = "Earth from Space (Fallback)";
            }
            // Launch Library 2
            try {
                // Try production API first, fallback to dev if rate limited.
                let res = await fetch('https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=15&format=json');
                if (!res.ok) {
                    res = await fetch('https://lldev.thespacedevs.com/2.2.0/launch/upcoming/?limit=15&format=json');
                }
                if (!res.ok) throw new Error(`API returned ${res.status}`);
                const data = await res.json();
                if (!data.results || data.results.length === 0) {
                    throw new Error("No launch data available");
                }
                let itemsHtml = '';
                // Filter out TBD (placeholder) launches to only show real-life exact timings
                const realLaunches = data.results.filter(l => l.status && l.status.abbrev !== 'TBD').slice(0, 10);
                if (realLaunches.length === 0) throw new Error("No confirmed launches");
                realLaunches.forEach(l => {
                    const d = new Date(l.net);
                    const dateStr = d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    itemsHtml += `
                        <div class="launch-item" onclick="window.open('https://spacelaunchnow.me/launch/${l.slug}', '_blank')">
                            <div class="launch-name">${l.name}</div>
                            <div class="launch-time">${dateStr}</div>
                        </div>
                    `;
                });
                document.getElementById('launch-list').innerHTML = `<div class="launch-track">${itemsHtml}${itemsHtml}</div>`;
            } catch (e) {
                console.error('Launch Error:', e);
                document.getElementById('launch-list').innerHTML = `<div style="padding: 1vw; font-size: 1.1vw; color: #94a3b8;">Schedules temporarily unavailable.</div>`;
            }
        }
        function renderCategory() {
            const cat = categories[currentCategoryIndex];
            document.getElementById('category-title').innerText = cat.name;
            document.getElementById('category-title').style.color = cat.color;
            document.getElementById('progress-bar').style.backgroundColor = cat.color;
            const track = document.getElementById('news-track');
            track.style.transition = 'none';
            track.style.transform = 'translateY(0)';
            currentSlideIndex = 0;
            progress = 0;
            const articles = newsData[cat.id] || [];
            let html = '';
            if (articles.length === 0) {
                html = `<div style="padding: 2vw; font-size: 1.5vw;">No news found for this category at the moment.</div>`;
            } else {
                articles.forEach((article, idx) => {
                    const d = new Date(article.published_at);
                    const dateStr = d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    // Provide a default image fallback inline
                    const cardImg = article.image_url || nextFallback();
                    html += `
                        <div class="news-card" style="border-top-color: ${cat.color}" data-idx="${idx}">
                            <img class="news-img" src="${cardImg}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1080&auto=format&fit=crop'" alt="">
                            <div class="news-content">
                                <div class="news-headline">${article.title}</div>
                                <div class="news-desc">${article.summary}</div>
                                <div class="news-meta">
                                    <span class="news-source">${article.news_site}</span>
                                    <span>${dateStr}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            track.innerHTML = html;
            // Force reflow before re-enabling transition
            void track.offsetWidth;
            track.style.transition = 'transform 1s cubic-bezier(0.25, 1, 0.5, 1)';
        }
        function openModal(article) {
            isModalOpen = true;
            document.getElementById('modal-img').src = article.image_url;
            document.getElementById('modal-title').innerText = article.title;
            document.getElementById('modal-desc').innerText = article.summary;
            document.getElementById('modal-source').innerText = article.news_site;
            const d = new Date(article.published_at);
            document.getElementById('modal-date').innerText = d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            document.getElementById('modal-link').href = article.url;
            const modal = document.getElementById('news-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 10);
        }
        function closeModal() {
            isModalOpen = false;
            const modal = document.getElementById('news-modal');
            modal.style.opacity = '0';
            setTimeout(() => modal.style.display = 'none', 300);
        }
        // card height 38vh + gap 2vh = 40vh per step
        const CARD_STEP = 40;
        function nextSlide() {
            if (isPaused || isModalOpen) return;
            const articles = newsData[categories[currentCategoryIndex].id] || [];
            // 2 cards visible at once (2 × 38vh + 2vh gap ≈ 78vh < 80vh available)
            const maxSlide = Math.max(0, articles.length - 2);
            if (currentSlideIndex < maxSlide) {
                currentSlideIndex++;
                document.getElementById('news-track').style.transform =
                    `translateY(calc(-${currentSlideIndex} * ${CARD_STEP}vh))`;
            }
        }
        function nextCategory() {
            if (isPaused || isModalOpen) return;
            currentCategoryIndex = (currentCategoryIndex + 1) % categories.length;
            renderCategory();
        }
        /* Manual navigation (Interactive Mode) */
        function manualNextSlide() {
            const articles = newsData[categories[currentCategoryIndex].id] || [];
            const maxSlide = Math.max(0, articles.length - 2);
            if (currentSlideIndex < maxSlide) {
                currentSlideIndex++;
                document.getElementById('news-track').style.transform =
                    `translateY(calc(-${currentSlideIndex} * ${CARD_STEP}vh))`;
            }
        }
        function manualPrevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                document.getElementById('news-track').style.transform =
                    `translateY(calc(-${currentSlideIndex} * ${CARD_STEP}vh))`;
            }
        }
        function manualNextCategory() {
            currentCategoryIndex = (currentCategoryIndex + 1) % categories.length;
            renderCategory();
        }
        function manualPrevCategory() {
            currentCategoryIndex = (currentCategoryIndex - 1 + categories.length) % categories.length;
            renderCategory();
        }
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        async function init() {
            updateClock();
            setInterval(updateClock, 1000);
            // Initial fetches
            fetchWidgets();
            setInterval(fetchWidgets, 60000); // refresh widgets every 60s
            await fetchNews();
            // Refresh news quietly in the background every 1 hour
            setInterval(fetchNews, 60 * 60 * 1000);
            // Force a full page reload every 24 hours to prevent browser memory leaks on continuous TV displays
            setTimeout(() => window.location.reload(), 24 * 60 * 60 * 1000);
            // Hide loading overlay
            const overlay = document.getElementById('loading-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 1000);
            renderCategory();
            // Setup timers — increased for more reading time
            setInterval(nextSlide, 10000);   // scroll news every 10 seconds
            setInterval(nextCategory, 60000); // switch category every 60 seconds
            // Progress bar logic (60 seconds total)
            setInterval(() => {
                if (!isHovered && !isModalOpen && !isPaused) {
                    progress += (100 / 600); // 60s = 600 ticks of 100ms
                    if (progress > 100) progress = 0;
                    document.getElementById('progress-bar').style.width = `${progress}%`;
                }
            }, 100);
            // Hover to pause
            const newsArea = document.querySelector('.news-area');
            newsArea.addEventListener('mouseenter', () => isHovered = true);
            newsArea.addEventListener('mouseleave', () => isHovered = false);
            // Touch Panel Modal Interactions
            document.getElementById('news-track').addEventListener('click', (e) => {
                const card = e.target.closest('.news-card');
                if (card) {
                    const idx = card.getAttribute('data-idx');
                    const article = newsData[categories[currentCategoryIndex].id][idx];
                    if (article) openModal(article);
                }
            });
            document.getElementById('news-modal').addEventListener('click', (e) => {
                if (e.target.id === 'news-modal' || e.target.classList.contains('close-btn')) {
                    closeModal();
                }
            });
        }
        /* ── Interactive ON / OFF ── */
        let isPaused = false;
        function setInteractive(on) {
            isPaused = on;
            const btnOn  = document.getElementById('btn-on');
            const btnOff = document.getElementById('btn-off');
            const controls = document.getElementById('interactive-controls');
            const launchTrack = document.querySelector('.launch-track');
            if (on) {
                // Interactive ON — pause auto-cycling, show nav arrows
                btnOn.classList.add('active');
                btnOff.classList.remove('active');
                if (controls) controls.classList.add('visible');
                if (launchTrack) launchTrack.style.animationPlayState = 'paused';
            } else {
                // Interactive OFF — resume auto-cycling, hide nav arrows
                btnOff.classList.add('active');
                btnOn.classList.remove('active');
                if (controls) controls.classList.remove('visible');
                if (launchTrack) launchTrack.style.animationPlayState = 'running';
            }
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
